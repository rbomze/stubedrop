plugins { id 'com.android.application' }
def ks = new Properties()
file('../keystore.properties').withInputStream { ks.load(it) }
android {
    namespace 'com.stubedrop.sender'
    compileSdk 35
    defaultConfig {
        applicationId 'com.stubedrop.sender'
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName '0.10'
    }
    signingConfigs {
        release {
            storeFile file('../' + ks['storeFile'])
            storePassword ks['storePassword']
            keyAlias ks['keyAlias']
            keyPassword ks['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
    // output file name: stube_receiver.apk / stube_sender.apk instead of app-release.apk
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = 'stube_sender.apk' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
